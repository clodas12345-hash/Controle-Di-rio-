name: Gerar Keystore Temporario

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar Keystore Debug Fixa
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GKD Mobility, OU=Dev, O=GKD, L=City, S=State, C=BR"
          base64 -w 0 debug.keystore > debug.keystore.b64
          echo "Tamanho do base64:"
          wc -c debug.keystore.b64

      - name: Publicar Keystore como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-gerada
          path: |
            debug.keystore
            debug.keystore.b64
